# Scratch (fork only, never upstream): the perf gate's instruction counts
# for a subset of scenes, this branch against BASE.
name: perf-scratch
on:
  push:
    branches: [perf-k4]
  workflow_dispatch:
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  BASE: 6d3a20fdfe9b40c8c76b785156af4c9d9c04fc82
  ONLY: "^(terminal|app-|spans-|pointer-move$|mount$|widgets$|canvas)"
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Packages
        timeout-minutes: 15
        run: sh .github/apt-install.sh valgrind cmake pkg-config fonts-dejavu-core libdbus-1-dev libfontconfig1-dev libwayland-dev libxcb1-dev libxkbcommon-dev libxrandr-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: perf-scratch
          cache-on-failure: true
      - name: Instruction counts
        env:
          ZGX_GATE_TARGET: target/perf-gate
          ZGX_GATE_FUNCTIONS: ${{ runner.temp }}/gate-functions
          ZGX_GATE_FUNCTIONS_FLOOR: "0"
          ZGX_GATE_FUNCTIONS_MAX: "4"
        run: |
          python3 - <<'EOF'
          import os, re, sys
          sys.path.insert(0, 'scripts/perf')
          sys.argv = ['gate.py', os.environ['BASE']]
          import gate
          gate.SCENES = [s for s in gate.SCENES if re.search(os.environ['ONLY'], s[0])]
          print('scenes:', [s[0] for s in gate.SCENES], flush=True)
          gate.main()
          EOF
